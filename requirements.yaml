metadata:
  project: Coronary_prj
  version: 1.0
  description: >
    Deterministic medical image AI training pipeline designed to
    demonstrate regulated software engineering principles.

requirements:

  # ==============================
  # System-Level Requirements
  # ==============================

  - id: SYS-001
    title: Deterministic System Behavior
    description: >
      The system shall produce reproducible outputs when executed
      with identical inputs and configuration parameters.

  - id: SYS-002
    title: Controlled Data Splitting
    description: >
      The system shall generate deterministic train, validation,
      and test splits based on a defined strategy.

  - id: SYS-003
    title: Traceable Verification
    description: >
      The system shall provide traceability between defined
      requirements and verification evidence.

  # ==============================
  # Data Ingestion Requirements
  # ==============================

  - id: DAT-001
    title: Dataset Validation
    description: >
      The system shall validate dataset structure and required
      files prior to training execution.

  - id: DAT-002
    title: Deterministic Data Access
    description: >
      The system shall provide indexed access to patient volumes
      and slices in a deterministic manner.

  - id: DAT-003
    title: Boundary Condition Handling
    description: >
      The system shall detect and reject invalid dataset indices
      or access requests outside defined bounds.

  # ==============================
  # Training Requirements
  # ==============================

  - id: TRN-001
    title: Controlled Model Initialization
    description: >
      The system shall initialize model parameters in a controlled
      and reproducible manner.

  - id: TRN-002
    title: Training Artifact Generation
    description: >
      The system shall generate structured artifacts describing
      training configuration and execution outcomes.

  # ==============================
  # Verification Requirements
  # ==============================

  - id: VER-001
    title: Automated Verification Execution
    description: >
      The system shall provide automated tests to verify
      dataset integrity, determinism, and boundary handling.

  - id: VER-002
    title: Evidence Capture
    description: >
      The system shall generate machine-readable verification
      evidence suitable for traceability reporting.
