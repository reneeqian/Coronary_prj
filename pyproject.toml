[project]
name = "Coronary_prj"
version = "0.1.0"
description = "Coronary Artery Calcium SaMD Project"
requires-python = ">=3.10"

dependencies = [
    "numpy==2.2.6",
    "torch==2.9.1",
    "matplotlib==3.10.8",
    "openpyxl==3.1.5",
    "pydicom==3.0.2",
    "scikit-image==0.25.2",
    "idna>=3.15",
    "forge-utils @ git+https://github.com/reneeqian/forge.git@v0.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "radon",
    "pip-audit",
]


[tool.pytest.ini_options]
pythonpath = ["src"]
markers = [
  "requirement(id): Traceability requirement ID",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN", "S"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]