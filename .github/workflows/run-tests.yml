name: Coronary CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pydicom scipy scikit-image imageio pytest-cov

      - name: Show repo structure
        run: |
          pwd
          ls -la
          ls -R
      
      - name: Install project
        run: |
          pip install -e 

      - name: Run tests
        run: |
          pytest Coronary_prj/tests --cov=Coronary_prj --cov-report=xml
