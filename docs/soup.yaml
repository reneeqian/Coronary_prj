    license: BSD-3-Clause

  - name: torch
    version: "2.9.1"
    purpose: "Deep learning model training and inference (UNet2D, CalciumScoreRegressor)"
    license: BSD-3-Clause

  - name: matplotlib
    version: "3.10.8"
    purpose: "Visualization for training plots and run reports"
