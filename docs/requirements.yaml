metadata:
  project: Coronary_prj
  version: 1.0
  description: >
    Coronary calcium application project demonstrating deterministic
    ingestion, task-specific data handling, and lightweight
    verification built on shared toolkit components.

requirements:

  # ==============================
  # System-Level Requirements
  # ==============================

  - id: SYS-001
    title: Deterministic System Behavior
    description: >
      The project shall behave deterministically when inputs,
      configuration, and random seeds are held constant.
    tags: [determinism, reproducibility, system_determinism]


  - id: SYS-002
    title: Controlled Data Splitting
    description: >
      The project shall generate train, validation, and test splits
      deterministically from an external split strategy.
    tags: [data_split, determinism, partitioning]


  - id: SYS-003
    title: Traceable Verification
    description: >
      The project shall support automated traceability between declared
      requirements and verification artifacts.
    tags: [traceability, verification, reporting]

  
  - id: SYS-004
    title: Coronary Model Development
    description: >
      The project shall support training workflows for a coronary
      calcium imaging task.
    tags: [training, coronary_model]


  - id: SYS-005
    title: Model Improvement Capability
    description: >
      The project shall support repeated model development as data or
      configuration changes.
    tags: [retraining, lifecycle]

  
  - id: SYS-006
    title: Dataset Task Encapsulation
    description: >
      Coronary-specific ingestion and task logic shall remain in
      project code rather than the shared toolkit core.
    tags: [architecture, separation_of_concerns, ingestion_design]


  - id: SYS-007
    title: Intended Use
    description: >
      The system is intended to assist trained radiologists in detecting and
      quantifying coronary artery calcium from non-contrast CT images
      (gated and non-gated protocols). It is not intended as a standalone
      diagnostic device. Output is advisory; clinical decisions remain with
      the responsible clinician.
    tags: [intended_use, samd]

  # ==============================
  # Data Ingestion Requirements
  # ==============================

  - id: DAT-001
    title: Dataset Validation
    description: >
      The project shall validate required dataset structure before
      attempting ingestion.
    tags: [dataset_validation, dataset_structure]


  - id: DAT-002
    title: Deterministic Data Access
    description: >
      Repeated access to unchanged dataset contents shall return
      consistent imaging data, metadata, and annotations.
    tags: [determinism, data_access]


  - id: DAT-003
    title: Patient Index Boundary Handling
    description: >
      Invalid patient identifiers shall fail with a defined dataset
      structure exception.
    tags: [boundary_check, patient_index]


  - id: DAT-004
    title: Successful Patient Ingestion
    description: >
      Patient ingestion shall produce structured in-memory patient data
      with consistent volume ordering and spatial metadata.
    tags: [patient_loading, ingestion_success]


  - id: DAT-005
    title: Data Ingestion Failure Modes
    description: >
      Missing or invalid required dataset contents shall fail with a
      defined dataset structure exception.
    tags: [patient_load_failure, ingestion_error]

  
  - id: DAT-006
    title: Lazy Patient Access
    description: >
      The ingestion interface shall support loading individual patients
      without preloading the full dataset.
    tags: [lazy_loading, performance]


  - id: DAT-007
    title: Dataset Element Boundary Handling
    description: >
      Invalid dataset references and out-of-bounds annotation indices
      shall be detected and handled explicitly.
    tags: [boundary_check, annotation_bounds]


  - id: DAT-008
    title: Deterministic Patient Sample Retrieval
    description: >
      Repeated retrieval of the same patient shall return identical
      data for unchanged dataset contents.
    tags: [determinism, patient_retrieval]


  - id: DAT-009
    title: Annotation Geometry Integrity
    description: >
      Parsed annotation geometry shall satisfy basic polygon validity
      constraints before use.
    tags: [annotation_validation, geometry]


  - id: DAT-010
    title: Optional Annotation Handling
    description: >
      Missing annotation files shall be handled as valid empty
      annotation state when allowed by the dataset.
    tags: [annotation_optional]


  - id: DAT-011
    title: Dataset Partition Generation
    description: >
      The project shall generate train, validation, and test
      partitions for the coronary dataset.
    tags: [partitioning, dataset_split]


  - id: DAT-012
    title: CT slices must be sorted by ImagePositionPatient[2] before volume construction
    description: >
      CT slices shall be ordered deterministically before volume
      construction.
    tags: [slice_sorting, dicom_integrity]

  
  - id: DAT-013
    title: Annotation Rasterization
    description: >
      Annotation contours shall be convertible into rasterized targets
      aligned with the source image slices.
    tags: [annotation_processing, mask_generation]

  - id: DAT-014
    title: Domain-Safe Ingestion Errors
    description: >
      Public ingestion APIs shall normalize dataset structure and
      integrity failures into a defined project-level exception type.
    tags: [ingestion_error, api_boundary]


  - id: DAT-015
    title: Nongated Dataset Structure Validation
    description: >
      The nongated ingestor shall validate that the dataset root
      contains patient directories and a scores file before ingestion.
    tags: [dataset_validation, nongated, dataset_structure]


  - id: DAT-016
    title: Nongated Score Loading
    description: >
      The nongated ingestor shall load per-vessel Agatston scores from
      the scores spreadsheet and attach them to each patient sample's
      metadata for downstream task use.
    tags: [score_loading, nongated, patient_metadata]

  # ==============================
  # Task Requirements
  # ==============================

  - id: TSK-001
    title: Task Definition Interface
    description: >
      The project shall define a task interface that converts ingested
      patient data into aligned training inputs and targets.
    tags: [task_interface]


  - id: TSK-002
    title: Coronary Calcium Detection Task
    description: >
      The project shall implement a coronary calcium task that produces
      targets aligned with CT data.
    tags: [coronary_task, calcium_detection]


  - id: TSK-003
    title: Task Determinism
    description: >
      Task preprocessing and target generation shall be deterministic
      for identical inputs.
    tags: [determinism, task_processing]

  
  - id: TSK-004
    title: Calcium Thresholding Support
    description: >
      The project shall support task-specific intensity thresholding
      where required by the coronary workflow.
    tags: [thresholding, preprocessing]


  - id: TSK-005
    title: Nongated Calcium Score Regression Task
    description: >
      The project shall implement a regression task that produces
      per-vessel log-transformed Agatston score targets from nongated
      CT slices, suitable for multi-output regression training.
    tags: [nongated_task, score_regression, calcium_scoring]


  - id: TSK-006
    title: Slice-Broadcast Target Design
    description: >
      Both task definitions broadcast the patient-level label (mask or
      score vector) to each 2D slice. This is an explicit design decision:
      the model learns to estimate the patient-level label from any
      representative slice, not from a privileged slice. Tests shall confirm
      all slices within a patient receive an identical target tensor.
    tags: [task_design, slice_broadcast]

  # ==============================
  # Training Requirements
  # ==============================

  - id: TRN-001
    title: Controlled Model Initialization
    description: >
      Training initialization shall be reproducible for identical model
      configuration and random seeds.
    tags: [determinism, model_init]


  - id: TRN-002
    title: Training Artifact Generation
    description: >
      Training runs shall produce structured artifacts describing run
      outputs and recorded metrics.
    tags: [artifact_generation, training_report]


  - id: TRN-003
    title: Coronary Model Training
    description: >
      The project shall support training a model on the coronary
      dataset.
    tags: [training]


  - id: TRN-004
    title: Coronary Model Retraining
    description: >
      The project shall support retraining with updated data or
      configuration.
    tags: [retraining]


  - id: TRN-005
    title: Coronary Dataset Training Interface
    description: >
      Coronary dataset code shall expose aligned training inputs and
      targets suitable for model training.
    tags: [training_interface]

  # ==============================
  # Model Requirements
  # ==============================

  - id: MOD-001
    title: Model Artifact Generation
    description: >
      Training shall produce a persisted model artifact.
    tags: [model_artifact]


  - id: MOD-002
    title: Model Artifact Persistence
    description: >
      Model artifacts shall be stored in a form suitable for later use.
    tags: [model_persistence]


  - id: MOD-003
    title: Model Evaluation Capability
    description: >
      The project shall support evaluation of trained model state on a
      held-out dataset partition.
    tags: [model_evaluation]


  - id: MOD-004
    title: Calcium Score Regression Model
    description: >
      The project shall provide a CNN regression model that accepts a
      single-channel CT slice and outputs per-vessel Agatston score
      predictions as a multi-output scalar vector.
    tags: [regression_model, nongated, calcium_scoring]


  - id: MOD-005
    title: Segmentation Performance Acceptance Criterion
    description: >
      The trained segmentation model shall achieve a Dice coefficient of at
      least SEGMENTATION_MIN_DICE (defined in Coronary_prj.thresholds) on
      the held-out test partition before being considered release-ready.
    tags: [performance, segmentation, acceptance_criterion]


  - id: MOD-006
    title: Regression Performance Acceptance Criterion
    description: >
      The trained regression model shall achieve a mean absolute error of at
      most REGRESSION_MAX_MAE_AU Agatston units (defined in
      Coronary_prj.thresholds) on the held-out test partition before being
      considered release-ready.
    tags: [performance, regression, acceptance_criterion]

  # ==============================
  # Risk Control Requirements
  # ==============================

  - id: RSK-001
    title: Missed Calcium Detection (False Negative)
    description: >
      The segmentation model shall be evaluated against a minimum Dice
      threshold (MOD-005) before deployment. A miss rate above the threshold
      shall be treated as a blocking defect.
    tags: [risk_control, false_negative, segmentation]


  - id: RSK-002
    title: Over-Estimation of Calcium Score (False Positive)
    description: >
      Regression outputs shall be back-transformed via expm1 before
      reporting. Values below 0 after back-transformation shall be clamped
      to 0 to prevent negative calcium scores.
    tags: [risk_control, false_positive, regression]


  - id: RSK-003
    title: Silent Ingestion Failure
    description: >
      All ingestor public methods shall raise DatasetStructureError (not
      raw exceptions) on corrupt or missing DICOM data, ensuring failures
      surface in the evidence report rather than being silently swallowed.
    tags: [risk_control, ingestion, error_handling]


  - id: RSK-004
    title: Numerical Instability in Log-Transformed Targets
    description: >
      log1p targets shall only be computed for non-negative inputs.
      Negative score values in the source spreadsheet shall be clamped to
      0.0 before log1p is applied, preventing NaN propagation into training.
    tags: [risk_control, numerical_stability, regression]

  # ==============================
  # Inference Requirements
  # ==============================
  - id: INF-001
    title: Inference Capability
    description: >
      The project shall support inference on new data using trained
      model state.
    tags: [inference]


  - id: INF-002
    title: Inference Determinism
    description: >
      Inference shall be deterministic for identical inputs and model
      state.
    tags: [determinism, inference]

  # ==============================
  # Reporting Requirements
  # ==============================
  - id: REP-001
    title: Training Report Generation
    description: >
      The project shall generate structured reports for training runs.
    tags: [training_report]


  - id: REP-002
    title: Visualization Support
    description: >
      The project may support lightweight visualization for inspection
      of training behavior or sample outputs.
    tags: [visualization, training_report]

  - id: REP-003
    title: PDF Report Export
    description: >
      The project shall support exporting run reports to PDF using the
      toolkit's reporting module, covering training, tuning, and model
      testing runs.
    tags: [reporting, visualization]

  - id: REP-004
    title: Status Report
    description: >
      The project shall expose a status_report() function that prints a
      structured console summary of the latest metrics from each run type
      (training, hyperparameter tuning, model testing).
    tags: [reporting, observability]

  # ==============================
  # Verification Requirements
  # ==============================

  - id: VER-001
    title: Automated Verification Execution
    description: >
      The project shall include automated verification of declared
      project behavior.
    tags: [verification, automated_tests]


  - id: VER-002
    title: Evidence Capture
    description: >
      Verification runs shall generate machine-readable evidence
      suitable for traceability reporting.
    tags: [evidence_generation]


  - id: VER-003
    title: Model Performance Verification
    description: >
      Verification shall support evaluation of trained model behavior on
      held-out data.
    tags: [performance_validation]

# ==============================
# Documentation Requirements
# ==============================

  - id: DOC-001
    title: Machine-Readable Requirements Definition
    description: >
      The project shall include a machine-readable requirements file.
    tags: [documentation]


  - id: DOC-002
    title: Basic Project Documentation
    description: >
      The project shall include a short README describing mission,
      scope, and verification entry points.
    tags: [documentation]


  - id: DOC-003
    title: Traceability Documentation
    description: >
      The project shall generate traceability outputs linking
      requirements to verification artifacts.
    tags: [traceability]
