metadata:
  project: Coronary_prj
  version: 1.0
  description: >
    Deterministic medical image AI training pipeline designed to
    demonstrate regulated software engineering principles.

requirements:

  # ==============================
  # System-Level Requirements
  # ==============================

  - id: SYS-001
    title: Deterministic System Behavior
    description: >
      The system shall produce identical model parameters, 
      dataset splits, and recorded metrics when executed with 
      identical input data, configuration parameters, and 
      random seeds.

  - id: SYS-002
    title: Controlled Data Splitting
    description: >
      The system shall generate train, validation, and test 
      splits deterministically according to a specified split 
      strategy and random seed.

  - id: SYS-003
    title: Traceable Verification
    description: >
      The system shall provide automated generation of a 
      requirement-to-test traceability matrix derived from machine-
      readable requirement definitions and test annotations.

  # ==============================
  # Data Ingestion Requirements
  # ==============================

  - id: DAT-001
    title: Dataset Validation
    description: >
      Prior to training execution, the system shall verify that the
       dataset root directory contains all required subdirectories 
       and files defined by the dataset specification.

  - id: DAT-002
    title: Deterministic Data Access
    description: >
      Indexed access to dataset contents shall be deterministic.
      Retrieval of a patient sample, full volume, or individual slice
      using dataset access interfaces shall return identical data
      across repeated calls given the same dataset state.

  - id: DAT-003
    title: Patient Index Boundary Handling
    description: >
      The system shall raise DatasetStructureError when a requested
      patient identifier does not exist in the dataset.

  - id: DAT-004
    title: Successful Data Ingestion
    description: >
      The system shall load patient imaging data from the dataset
      root directory into a structured in-memory representation.
      The resulting volume shall have consistent dimensional ordering,
      correct voxel spacing metadata, and shall preserve the physical
      slice ordering defined by the dataset.

  - id: DAT-005
    title: Data Ingestion Failure Modes
    description: >
      The system shall raise a defined exception with a descriptive error 
      message when required dataset files or directories are missing.
  
  - id: DAT-006
    title: Lazy Patient Access
    description: >
      The system shall support retrieval of an individual patient
      sample or image volume without requiring ingestion of the
      entire dataset into memory.

  - id: DAT-007
    title: Volume and Slice Index Boundary Handling
    description: >
      The system shall raise DatasetStructureError when a requested
      slice index or dataset element index is outside the valid
      bounds of the available patient data.

  - id: DAT-008
    title: Deterministic Slice Retrieval
    description: >
      Repeated retrieval of the same patient volume or slice shall
      return identical numerical data given unchanged dataset state.

  - id: DAT-009
    title: Annotation Geometry Integrity
    description: >
      Parsed annotation regions shall contain valid polygon geometry
      consisting of at least three coordinate points.

  - id: DAT-010
    title: Optional Annotation Handling
    description: >
      The system shall allow datasets that contain no annotation files
      and shall return an empty annotation container without raising
      an exception.


  # ==============================
  # Training Requirements
  # ==============================

  - id: TRN-001
    title: Controlled Model Initialization
    description: >
      Model parameter initialization shall be deterministic given a fixed 
      random seed and identical model configuration.

  - id: TRN-002
    title: Training Artifact Generation
    description: >
      Each training run shall produce structured artifacts that record 
      configuration parameters, random seeds, dataset split identifiers, 
      and final performance metrics.

  # ==============================
  # Verification Requirements
  # ==============================

  - id: VER-001
    title: Automated Verification Execution
    description: >
      The project shall include automated tests verifying dataset
      integrity, deterministic behavior, boundary condition
      enforcement, and annotation validity.

  - id: VER-002
    title: Evidence Capture
    description: >
      The system shall generate machine-readable verification artifacts 
      suitable for automated traceability reporting.

# ==============================
# Documentation Requirements
# ==============================

  - id: DOC-001
    title: Machine-Readable Requirements Definition
    description: >
      The project shall include a machine-readable
      requirements.yaml file defining system requirements.

  - id: DOC-002
    title: Basic Project Documentation
    description: >
      The project shall include a README file describing
      system purpose, configuration, and execution steps.